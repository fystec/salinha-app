# Publica uma versão nova do app de PC da Salinha (Windows e, quando vier junto, Linux: AppImage + .deb).
# O instalador é montado em outro lugar e fica (temporariamente) em salinha.live/desktop-rel/<versão>/, em pedaços de 24 MB.
# Quando o arquivo lancar.json muda, este robô junta os pedaços, confere o código de verificação (sha512)
# e cria o lançamento — de onde o app de PC de todo mundo baixa a atualização sozinho.
name: Publicar versão do app de PC (Windows e Linux)

on:
  push:
    paths: ['lancar.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Juntar e conferir o instalador
        run: |
          V=$(jq -r .versao lancar.json)
          BASE=$(jq -r .base lancar.json)
          N=$(jq -r .pedacos lancar.json)
          echo "V=$V" >> "$GITHUB_ENV"
          mkdir out && cd out
          for i in $(seq 0 $((N-1))); do curl -fsSL --retry 5 -o "p$i" "$BASE/Salinha-Setup.exe.part$(printf %02d $i)"; done
          cat $(for i in $(seq 0 $((N-1))); do echo p$i; done) > Salinha-Setup.exe && rm p*
          curl -fsSL --retry 5 -o Salinha-Setup.exe.blockmap "$BASE/Salinha-Setup.exe.blockmap"
          curl -fsSL --retry 5 -o latest.yml "$BASE/latest.yml"
          grep -q "^version: $V$" latest.yml || { echo "latest.yml não é da versão $V"; exit 1; }
          WANT=$(grep -m1 '^sha512:' latest.yml | awk '{print $2}')
          GOT=$(openssl dgst -sha512 -binary Salinha-Setup.exe | base64 -w0)
          [ "$WANT" = "$GOT" ] || { echo "O instalador chegou diferente do esperado (sha512)"; exit 1; }
          # Linux (opcional): junta os pedaços do AppImage e do .deb e confere os dois pelo latest-linux.yml
          NA=$(jq -r '.linux.appimage // 0' ../lancar.json); ND=$(jq -r '.linux.deb // 0' ../lancar.json)
          if [ "$NA" -gt 0 ] && [ "$ND" -gt 0 ]; then
            junta() { for i in $(seq 0 $(($2-1))); do curl -fsSL --retry 5 -o "q$i" "$BASE/$1.part$(printf %02d $i)"; done; cat $(for i in $(seq 0 $(($2-1))); do echo q$i; done) > "$1" && rm q*; }
            junta Salinha-x86_64.AppImage "$NA"
            junta salinha_amd64.deb "$ND"
            curl -fsSL --retry 5 -o latest-linux.yml "$BASE/latest-linux.yml"
            grep -q "^version: $V$" latest-linux.yml || { echo "latest-linux.yml não é da versão $V"; exit 1; }
            for f in Salinha-x86_64.AppImage salinha_amd64.deb; do
              WANT=$(grep -A1 "url: $f$" latest-linux.yml | awk '/sha512:/ {print $2}')
              GOT=$(openssl dgst -sha512 -binary "$f" | base64 -w0)
              [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || { echo "$f chegou diferente do esperado (sha512)"; exit 1; }
            done
            chmod +x Salinha-x86_64.AppImage
            echo "LINUX=1" >> "$GITHUB_ENV"
          fi
          ls -la
      - name: Criar o lançamento
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          gh release view "v$V" >/dev/null 2>&1 && { echo "v$V já existe"; exit 0; }
          EXTRA=""; [ "${LINUX:-}" = "1" ] && EXTRA="Salinha-x86_64.AppImage salinha_amd64.deb latest-linux.yml"
          gh release create "v$V" Salinha-Setup.exe Salinha-Setup.exe.blockmap latest.yml $EXTRA --title "$V" --notes "$(jq -r '.notas // ""' ../lancar.json)" --latest
